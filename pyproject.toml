[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "terminal-mcp"
version = "0.1.0"
description = "MCP server for interactive terminal sessions (SSH, REPLs, database CLIs)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0,<2.0.0",
    "pexpect>=4.9.0",
    "pyte>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
terminal-mcp = "terminal_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["terminal_mcp*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
